version: '3.9'

services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"

  ml-client:
    build: ./machine-learning-client
    container_name: ml-client
    command: ["python", "ml_client.py"]

  web-app:
    build: ./web-app
    container_name: web-app
    ports:
      - "5000:5000"
